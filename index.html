<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JHHHGAMES</title>
<meta name="description" content="JHHHGAMES: juegos de puzzles y aventuras espaciales, gratis y para todos. Hechos en Costa Rica.">
<link rel="icon" href="icono.png">
<style>
  :root{--bg:#0b0a1f;--fg:#eef0ff;--muted:#a9addb;--accent:#ffb547;--panel:rgba(255,255,255,.05);--line:rgba(160,170,255,.2)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
  .hero{display:block;width:100%;aspect-ratio:16/9;max-height:62vh;object-fit:cover}
  main{max-width:880px;margin:0 auto;padding:32px 20px 64px}
  h2{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  .game{display:flex;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
  .game img{width:88px;height:88px;border-radius:20px;flex:none}
  .game h3{margin:0;font-size:22px} .game p{margin:4px 0 0;color:var(--muted)}
  .soon{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:#1a1030;background:var(--accent);border-radius:999px;padding:3px 10px}
  footer{max-width:880px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 20px}
  a{color:var(--accent)}
</style>
</head>
<body>
<img class="hero" src="encabezado.jpg" alt="JHHHGAMES, juegos que valen un universo">
<main>
  <h2>Nuestros juegos</h2>
  <div class="game">
    <img src="icono-fusion-estelar.png" alt="">
    <div>
      <h3>Fusión Estelar</h3>
      <p>Une planetas iguales, crea agujeros negros y conquista 11 mundos.</p>
      <span class="soon">Muy pronto en Google Play y App Store</span>
    </div>
  </div>
</main>
<footer>
  <span>© 2026 JHHHGAMES · Costa Rica</span>
  <a href="politica-privacidad.html">Política de privacidad</a>
  <a href="politica-privacidad.html#borrar-cuenta">Borrar mi cuenta</a>
  <span>Contacto: <a href="mailto:scorpionjmna@gmail.com">scorpionjmna@gmail.com</a></span>
</footer>
</body>
</html>
